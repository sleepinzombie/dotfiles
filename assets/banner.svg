<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="dotfiles">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>

  <g transform="translate(70 70)">
    <rect width="300" height="180" rx="12" fill="#0b1020" stroke="#334155"/>
    <circle cx="20" cy="20" r="6" fill="#f87171"/>
    <circle cx="40" cy="20" r="6" fill="#fbbf24"/>
    <circle cx="60" cy="20" r="6" fill="#34d399"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
      <text x="20" y="62" fill="#94a3b8">$ ./setup.sh</text>
      <text x="20" y="88" fill="#34d399">[ ok ] git-sync-fork</text>
      <text x="20" y="110" fill="#34d399">[ ok ] git-prune-branches</text>
      <text x="20" y="132" fill="#34d399">[ ok ] vscode-sync-extensions</text>
      <text x="20" y="160" fill="#38bdf8">$ <tspan fill="#e2e8f0">_</tspan></text>
    </g>
  </g>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="430" y="150" font-size="72" font-weight="800" fill="url(#accent)">.dotfiles</text>
    <text x="434" y="196" font-size="24" fill="#cbd5e1">My development setup, one command away on any machine.</text>
    <g font-size="16" fill="#e2e8f0">
      <rect x="434" y="224" width="86" height="32" rx="16" fill="#1e293b" stroke="#334155"/>
      <text x="477" y="246" text-anchor="middle">VS Code</text>
      <rect x="532" y="224" width="64" height="32" rx="16" fill="#1e293b" stroke="#334155"/>
      <text x="564" y="246" text-anchor="middle">Git</text>
      <rect x="608" y="224" width="104" height="32" rx="16" fill="#1e293b" stroke="#334155"/>
      <text x="660" y="246" text-anchor="middle">PowerShell</text>
      <rect x="724" y="224" width="86" height="32" rx="16" fill="#1e293b" stroke="#334155"/>
      <text x="767" y="246" text-anchor="middle">Bash</text>
    </g>
  </g>
</svg>
